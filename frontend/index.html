<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mochiro — Endless runner on Arc</title>
    <meta name="description" content="Mochiro is a free 3D endless runner you play in the browser. Dash through traffic, chain combos, complete missions and climb the global leaderboard on Arc." />
    <meta name="theme-color" content="#0b1d47" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="canonical" href="https://mochiro.xyz/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mochiro" />
    <meta property="og:url" content="https://mochiro.xyz/" />
    <meta property="og:title" content="Mochiro — Endless runner on Arc" />
    <meta property="og:description" content="Dash, dodge and chain combos in a free 3D runner. Sign in with your wallet or Google and climb the global board." />
    <meta property="og:image" content="https://mochiro.xyz/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mochiro — Endless runner on Arc" />
    <meta name="twitter:description" content="Dash, dodge and chain combos in a free 3D runner. Climb the global board." />
    <meta name="twitter:image" content="https://mochiro.xyz/og-image.png" />
    <script>
      document.documentElement.classList.add('dark');
    </script>
  </head>
  <body>
    <div id="root"><!--ssr-outlet--></div>
    <script type="module" src="./src/entry-client.tsx"></script>
    <script>
      // Fallback: if React fails to render (e.g. Vite dep stubs during cold
      // start), auto-reload until deps are ready.  This fires OUTSIDE React
      // so it works even when React itself is null/undefined.
      (function(){
        var K='__boot_reload', W=30000, M=8;
        function st(){try{return JSON.parse(sessionStorage.getItem(K))||{c:0,t:0}}catch(e){return{c:0,t:0}}}
        setTimeout(function(){
          if(window.__reactOk)return;
          var s=st(),c=(Date.now()-s.t>W)?0:s.c;
          if(c<M){sessionStorage.setItem(K,JSON.stringify({c:c+1,t:Date.now()}));location.reload()}
        },3000);
      })();
    </script>
    <!-- Plaza badge: rendered only when this deployed site is shared on Surf Plaza. -->
    <script>
    (function(){
      try{
        var m=location.hostname.match(/^([a-z0-9][a-z0-9-]{0,51})\.(?:surf\.computer|stg\.ask\.surf)$/i);
        if(!m)return;
        var slug=m[1].toLowerCase();
        fetch('https://api.asksurf.ai/muninn/v1/plaza/by-subdomain?subdomain='+encodeURIComponent(slug))
          .then(function(r){return r.ok?r.json():null;})
          .then(function(j){
            var d=j&&j.data;
            if(!d||!d.shared||!d.listing_id)return;
            var a=document.createElement('a');
            a.id='plaza-badge';
            a.href='https://asksurf.ai/studio/gallery?id='+encodeURIComponent(d.listing_id);
            a.target='_blank';
            a.rel='noopener noreferrer';
            a.setAttribute('aria-label','Remix this on Surf Plaza');
            a.style.cssText='position:fixed;bottom:56px;right:16px;z-index:2147483647;display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;font-family:"Lato",system-ui,sans-serif;font-size:12px;font-weight:500;line-height:16px;text-decoration:none;background:#fd5587;color:#fff;box-shadow:0 1px 1px rgba(51,51,51,.08),0 6px 12px rgba(51,51,51,.16);opacity:.92;transition:opacity .2s';
            a.onmouseenter=function(){a.style.opacity='1';};
            a.onmouseleave=function(){a.style.opacity='.92';};
            a.innerHTML='<span aria-hidden="true" style="font-size:13px;line-height:1">↻</span><span>Remix on Plaza</span>';
            var s=document.createElement('style');
            s.textContent='@media print{#plaza-badge{display:none}}';
            document.head.appendChild(s);
            document.body.appendChild(a);
          })
          .catch(function(){});
      }catch(e){}
    })();
    </script>
  </body>
</html>
